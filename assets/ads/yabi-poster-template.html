<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YABI Location — affiche Google Ads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #071b43;
      --blue: #1456d9;
      --blue-deep: #0b3fa8;
      --lime: #b9df16;
      --white: #ffffff;
      --mist: #eef4fb;
      --display: "Barlow Condensed", Impact, sans-serif;
      --body: "Manrope", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--white);
    }

    body {
      color: var(--navy);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .poster {
      position: relative;
      isolation: isolate;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--white);
    }

    .photo {
      position: absolute;
      z-index: -3;
      overflow: hidden;
      background: #dbe5ef;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 20, 52, 0) 50%, rgba(4, 20, 52, .6) 100%);
    }

    .blue-shape {
      position: absolute;
      z-index: -2;
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
    }

    .content {
      position: absolute;
      z-index: 2;
    }

    .logo {
      display: block;
      width: auto;
      object-fit: contain;
    }

    .eyebrow {
      margin: 0 0 .16em;
      color: var(--blue);
      font-family: var(--body);
      font-weight: 800;
      line-height: 1;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 100%;
      font-family: var(--display);
      font-weight: 800;
      line-height: .92;
      letter-spacing: -.015em;
      text-wrap: balance;
      text-transform: uppercase;
    }

    h1 .accent { color: var(--blue); }

    h1 .title-line { display: block; }

    body[data-format="mobile"] h1 .format-break,
    body[data-format="landscape"] h1 .format-break {
      display: block;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      margin-top: .34em;
      gap: .2em .38em;
    }

    .price {
      color: var(--blue);
      font-family: var(--display);
      font-weight: 800;
      line-height: .9;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    .price-note {
      max-width: 13em;
      color: var(--navy);
      font-weight: 800;
      line-height: 1.15;
      text-transform: uppercase;
    }

    .benefits {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--navy);
      font-weight: 700;
      line-height: 1.3;
    }

    .benefits li { white-space: nowrap; }

    .benefits li + li::before {
      content: "";
      display: inline-block;
      width: .32em;
      height: .32em;
      margin: 0 .62em .12em;
      border-radius: 50%;
      background: var(--lime);
    }

    .offer {
      position: absolute;
      z-index: 3;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--lime);
      color: var(--navy);
      font-family: var(--display);
      font-weight: 800;
      line-height: .86;
      letter-spacing: -.02em;
      text-align: center;
      text-transform: uppercase;
      transform: rotate(-4deg);
      box-shadow: 0 12px 30px rgba(7, 27, 67, .2);
    }

    .offer small {
      display: block;
      margin-top: .15em;
      font-family: var(--body);
      font-size: .28em;
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: .04em;
    }

    .models {
      position: absolute;
      z-index: 3;
      display: flex;
      align-items: center;
      color: var(--white);
      font-family: var(--body);
      font-weight: 800;
      line-height: 1;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .4);
    }

    .models span + span::before {
      content: "·";
      margin: 0 .55em;
      color: var(--lime);
    }

    .cta {
      position: absolute;
      z-index: 4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--blue);
      color: var(--white);
      font-family: var(--body);
      font-weight: 800;
      line-height: 1;
      letter-spacing: .035em;
      text-transform: uppercase;
      box-shadow: 0 12px 30px rgba(7, 27, 67, .24);
    }

    .url {
      position: absolute;
      z-index: 4;
      color: var(--white);
      font-family: var(--body);
      font-weight: 700;
      line-height: 1;
      letter-spacing: .01em;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .5);
    }

    body[data-format="mobile"] .content {
      top: 135px;
      left: 108px;
      width: 864px;
    }

    body[data-format="mobile"] .logo {
      width: 137px;
      height: 108px;
      margin-bottom: 32px;
    }

    body[data-format="mobile"] .eyebrow { font-size: 22px; }
    body[data-format="mobile"] h1 { width: 800px; font-size: 75px; }
    body[data-format="mobile"] .price-row { margin-top: 27px; }
    body[data-format="mobile"] .price { font-size: 77px; }
    body[data-format="mobile"] .price-note { font-size: 21px; }
    body[data-format="mobile"] .benefits { margin-top: 24px; font-size: 19px; }

    body[data-format="mobile"] .photo {
      inset: 714px 0 0;
    }

    body[data-format="mobile"] .photo img { object-position: 56% center; }

    body[data-format="mobile"] .blue-shape {
      left: -100px;
      bottom: -138px;
      width: 900px;
      height: 390px;
      border-radius: 50% 55% 0 0 / 75% 75% 0 0;
      transform: rotate(-6deg);
    }

    body[data-format="mobile"] .offer {
      right: 120px;
      top: 657px;
      width: 198px;
      height: 198px;
      font-size: 57px;
    }

    body[data-format="mobile"] .models {
      left: 108px;
      bottom: 234px;
      font-size: 23px;
    }

    body[data-format="mobile"] .cta {
      left: 108px;
      bottom: 135px;
      width: 443px;
      height: 78px;
      font-size: 25px;
    }

    body[data-format="mobile"] .url {
      right: 108px;
      bottom: 153px;
      font-size: 19px;
    }

    body[data-format="square"] .content {
      top: 120px;
      left: 120px;
      width: 960px;
    }

    body[data-format="square"] .logo {
      width: 128px;
      height: 101px;
      margin-bottom: 29px;
    }

    body[data-format="square"] .eyebrow { font-size: 21px; }
    body[data-format="square"] h1 { width: 860px; font-size: 75px; }
    body[data-format="square"] .price-row { margin-top: 24px; }
    body[data-format="square"] .price { font-size: 74px; }
    body[data-format="square"] .price-note { font-size: 20px; }
    body[data-format="square"] .benefits { margin-top: 22px; font-size: 18px; }

    body[data-format="square"] .photo { inset: 640px 0 0; }
    body[data-format="square"] .photo img { object-position: 56% center; }

    body[data-format="square"] .blue-shape {
      left: -110px;
      bottom: -145px;
      width: 980px;
      height: 360px;
      border-radius: 50% 55% 0 0 / 75% 75% 0 0;
      transform: rotate(-5deg);
    }

    body[data-format="square"] .offer {
      right: 128px;
      top: 584px;
      width: 190px;
      height: 190px;
      font-size: 55px;
    }

    body[data-format="square"] .models {
      left: 120px;
      bottom: 208px;
      font-size: 22px;
    }

    body[data-format="square"] .cta {
      left: 120px;
      bottom: 120px;
      width: 436px;
      height: 72px;
      font-size: 24px;
    }

    body[data-format="square"] .url {
      right: 120px;
      bottom: 142px;
      font-size: 19px;
    }

    body[data-format="landscape"] .photo {
      inset: 0 0 0 570px;
    }

    body[data-format="landscape"] .photo img { object-position: 59% center; }

    body[data-format="landscape"] .photo::after {
      background: linear-gradient(90deg, rgba(4, 20, 52, 0) 45%, rgba(4, 20, 52, .5) 100%);
    }

    body[data-format="landscape"] .blue-shape {
      left: 472px;
      top: -95px;
      width: 330px;
      height: 820px;
      border-radius: 0 65% 55% 0 / 0 48% 52% 0;
      transform: rotate(6deg);
    }

    body[data-format="landscape"] .content {
      top: 63px;
      left: 120px;
      width: 480px;
    }

    body[data-format="landscape"] .logo {
      width: 83px;
      height: 66px;
      margin-bottom: 18px;
    }

    body[data-format="landscape"] .eyebrow { font-size: 13px; }
    body[data-format="landscape"] h1 { width: 350px; font-size: 40px; }
    body[data-format="landscape"] .price-row { margin-top: 17px; gap: 10px 17px; }
    body[data-format="landscape"] .price { font-size: 42px; }
    body[data-format="landscape"] .price-note { max-width: 150px; font-size: 12px; }
    body[data-format="landscape"] .benefits { margin-top: 15px; font-size: 12px; }

    body[data-format="landscape"] .offer {
      right: 124px;
      top: 67px;
      width: 108px;
      height: 108px;
      font-size: 31px;
    }

    body[data-format="landscape"] .models {
      left: 700px;
      bottom: 130px;
      font-size: 14px;
    }

    body[data-format="landscape"] .cta {
      left: 120px;
      bottom: 63px;
      width: 258px;
      height: 53px;
      font-size: 15px;
    }

    body[data-format="landscape"] .url {
      right: 120px;
      bottom: 66px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="poster" aria-label="Affiche publicitaire YABI Location">
    <div class="photo" aria-hidden="true">
      <img src="../fleet-hero-1600.webp" alt="">
    </div>
    <div class="blue-shape" aria-hidden="true"></div>

    <section class="content">
      <img class="logo" src="../yabi-logo.webp" alt="YABI Location">
      <p class="eyebrow">Location mensuelle d’utilitaires</p>
      <h1>
        <span class="title-line">Votre utilitaire.</span>
        <span class="accent">Sans leasing <span class="format-break">longue durée.</span></span>
      </h1>
      <div class="price-row">
        <div class="price">Dès 1 200 €</div>
        <div class="price-note">HTVA / mois<br>Assurance comprise</div>
      </div>
      <ul class="benefits" aria-label="Avantages">
        <li>Dès 1 mois</li>
        <li>Pour professionnels</li>
      </ul>
    </section>

    <div class="offer">–15 %<small>dès 4 mois</small></div>
    <div class="models"><span>L1H1</span><span>L2H2</span><span>L3H2</span></div>
    <div class="cta">Demander une offre</div>
    <div class="url">yabilocation.com</div>
  </main>

  <script>
    const format = new URLSearchParams(location.search).get("format") || "mobile";
    const allowed = new Set(["mobile", "square", "landscape"]);
    document.body.dataset.format = allowed.has(format) ? format : "mobile";
  </script>
</body>
</html>
