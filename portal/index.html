<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#062f69">
  <title>YABI</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal.css?v=20260728-3">
  <script src="portal.js?v=20260728-3" defer></script>
</head>
<body data-api-base="https://kindhearted-caiman-242.eu-west-1.convex.site">
  <a class="skip-link" href="#portal-main" data-i18n="Skip to content">Skip to content</a>

  <main class="login-screen" id="login-screen">
    <section class="login-panel" aria-labelledby="login-title">
      <div class="login-card">
        <div class="login-topline">
          <a class="minimal-brand" href="../index.html" aria-label="YABI Location">YABI</a>
          <div class="language-switch" aria-label="Language">
            <button type="button" data-language="en" aria-pressed="true">EN</button>
            <button type="button" data-language="fr" aria-pressed="false">FR</button>
            <button type="button" data-language="nl" aria-pressed="false">NL</button>
          </div>
        </div>
        <h1 id="login-title" data-i18n="Sign in">Sign in</h1>
        <p data-i18n="Use your personal access code.">Use your personal access code.</p>
        <form id="login-form">
          <label for="access-code" data-i18n="Access code">Access code</label>
          <input id="access-code" name="code" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="YABI-XXXX-XXXX-XXXX" maxlength="24" required>
          <button class="primary-button" type="submit">
            <span data-i18n="Continue">Continue</span>
          </button>
          <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
        </form>
        <a class="back-link" href="../index.html" data-i18n="Public website">Public website</a>
      </div>
    </section>
  </main>

  <div class="portal-app" id="portal-app" hidden>
    <header class="portal-header">
      <div class="header-left">
        <button class="menu-button" id="menu-button" type="button" aria-label="Open navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <a class="header-brand" href="#overview" aria-label="YABI">YABI</a>
      </div>
      <div class="header-status">
        <div class="language-switch language-switch-header" aria-label="Language">
          <button type="button" data-language="en" aria-pressed="true">EN</button>
          <button type="button" data-language="fr" aria-pressed="false">FR</button>
          <button type="button" data-language="nl" aria-pressed="false">NL</button>
        </div>
        <button class="profile-button" id="profile-button" type="button">
          <span class="profile-avatar" id="profile-avatar">YA</span>
          <span><strong id="profile-name">YABI</strong><small id="profile-role">Role</small></span>
        </button>
      </div>
    </header>

    <aside class="portal-sidebar" id="portal-sidebar" aria-label="Portal navigation">
      <div class="sidebar-role">
        <strong id="sidebar-workspace">Operations</strong>
      </div>
      <nav id="portal-navigation"></nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank" rel="noopener" data-i18n="Public website">Public website</a>
        <button id="logout-button" type="button" data-i18n="Sign out">Sign out</button>
      </div>
    </aside>
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>

    <main class="portal-main" id="portal-main" tabindex="-1">
      <div class="view-shell" id="view-root">
        <div class="loading-state"><span></span><p data-i18n="Loading…">Loading…</p></div>
      </div>
    </main>
  </div>

  <dialog class="portal-modal" id="portal-modal">
    <div class="modal-card">
      <header class="modal-header">
        <div>
          <p class="kicker" id="modal-kicker">YABI</p>
          <h2 id="modal-title">Action</h2>
        </div>
        <button id="modal-close" class="modal-close" type="button" aria-label="Close">×</button>
      </header>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </dialog>

  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
</body>
</html>
